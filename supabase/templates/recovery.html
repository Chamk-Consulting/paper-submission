<div style="font-family:Arial,sans-serif;max-width:520px;margin:0 auto;color:#0E1B3D">
  <p style="font-family:Georgia,serif;font-size:22px">&#9679; Plenary</p>
  <h1 style="font-family:Georgia,serif;font-weight:400">Reset your password</h1>
  <p>Someone asked to reset the password for this account. If it was you, choose a new password below. If not, ignore this email.</p>
  <p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;background:#0E1B3D;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none">Choose a new password</a></p>
  <p style="color:#5B6478;font-size:13px">This link works once and expires in 1 hour.</p>
</div>
